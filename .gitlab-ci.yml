# GitLab Pages — publishes the site on every push to the default branch (master).
# All build logic lives in scripts/build-site.sh (single source, shared with
# GitHub Actions); this job only calls it with the baseUrl provided by GitLab.
pages:
  stage: deploy
  image: node:22
  script:
    - BASE_URL="$CI_PAGES_URL" bash scripts/build-site.sh
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
