# GitHub Pages — publishes the site on every push to master.
# Same build logic as GitLab: delegates to scripts/build-site.sh
# (single source). Only the GitHub plumbing and the baseUrl differ.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # creation/update dates via git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # enables GitHub Pages (build via Actions) if not already done
      - name: Build
        run: BASE_URL="${{ steps.pages.outputs.base_url }}" bash scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
