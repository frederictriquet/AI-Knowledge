# GitHub Pages — publie le site à chaque push sur master.
# Même logique de build que GitLab : on délègue à scripts/build-site.sh
# (source unique). Seuls la plomberie GitHub et le baseUrl diffèrent.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # dates de création/maj via git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # active GitHub Pages (build via Actions) si pas déjà fait
      - name: Build
        run: BASE_URL="${{ steps.pages.outputs.base_url }}" bash scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
